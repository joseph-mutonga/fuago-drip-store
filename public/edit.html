<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Product - Admin</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .edit-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 400px;
      max-width: 90%;
    }

    h2 {
      text-align: center;
      color: #232f3e;
    }

    form input,
    form textarea,
    form button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    form button {
      background: #ffa41c;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    .preview {
      text-align: center;
      margin: 10px 0;
    }

    .preview img {
      max-width: 150px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .back-btn {
      background: #232f3e;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .logout-btn {
      background: #e63946;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* -------------------- Responsive Design -------------------- */

    /* Tablets */
    @media screen and (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
      }

      .main {
        padding: 10px;
      }

      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
    }

    /* Phones */
    @media screen and (max-width: 480px) {
      .sidebar button {
        font-size: 14px;
        padding: 8px;
      }

      .product-card img {
        height: 120px;
      }

      form input,
      form textarea,
      form button {
        padding: 8px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="edit-container" style="width: 550px; max-width: 95%;">
    <h2>✏️ Edit Laptop Details</h2>
    <form id="editForm" enctype="multipart/form-data">
      <label style="font-size:12px; font-weight:700; color:#475569;">Laptop Name</label>
      <input type="text" id="name" name="name" placeholder="Laptop Model Name" required />

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin: 6px 0;">
        <div>
          <label style="font-size:12px; font-weight:700; color:#475569;">Brand</label>
          <select id="brand" name="brand" required style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc; font-size:14px;">
            <option value="Apple">Apple</option>
            <option value="Dell">Dell</option>
            <option value="ASUS">ASUS</option>
            <option value="Lenovo">Lenovo</option>
            <option value="HP">HP</option>
            <option value="Acer">Acer</option>
            <option value="MSI">MSI</option>
            <option value="Razer">Razer</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label style="font-size:12px; font-weight:700; color:#475569;">Category</label>
          <select id="category" name="category" required style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc; font-size:14px;">
            <option value="Ultrabook">Ultrabook / Thin & Light</option>
            <option value="Gaming">Gaming Laptop</option>
            <option value="Business">Business</option>
            <option value="Student">Student / Everyday</option>
            <option value="Workstation">Workstation</option>
          </select>
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin: 6px 0;">
        <div>
          <label style="font-size:12px; font-weight:700; color:#475569;">Processor (CPU)</label>
          <input type="text" id="processor" name="processor" placeholder="e.g. M3 Max, Core i9" required />
        </div>
        <div>
          <label style="font-size:12px; font-weight:700; color:#475569;">Graphics (GPU)</label>
          <input type="text" id="gpu" name="gpu" placeholder="e.g. RTX 4080" />
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin: 6px 0;">
        <div>
          <label style="font-size:12px; font-weight:700; color:#475569;">RAM</label>
          <input type="text" id="ram" name="ram" placeholder="e.g. 32GB DDR5" required />
        </div>
        <div>
          <label style="font-size:12px; font-weight:700; color:#475569;">Storage</label>
          <input type="text" id="storage" name="storage" placeholder="e.g. 1TB SSD" required />
        </div>
        <div>
          <label style="font-size:12px; font-weight:700; color:#475569;">Screen Size</label>
          <input type="text" id="screen_size" name="screen_size" placeholder="e.g. 16\" OLED" required />
        </div>
      </div>

      <label style="font-size:12px; font-weight:700; color:#475569;">Description & Specs</label>
      <textarea id="description" name="description" placeholder="Description" required rows="3"></textarea>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin: 6px 0;">
        <div>
          <label style="font-size:12px; font-weight:700; color:#475569;">Price ($ USD)</label>
          <input type="number" step="0.01" id="price" name="price" placeholder="Price" required />
        </div>
        <div>
          <label style="font-size:12px; font-weight:700; color:#475569;">Stock Quantity</label>
          <input type="number" id="quantity" name="quantity" placeholder="Quantity" required />
        </div>
      </div>

      <div class="preview" id="imagePreview" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
      </div>

      <label style="font-size:12px; font-weight:700; color:#475569;">Replace Photos (Optional, up to 5)</label>
      <input type="file" id="image" name="images" accept="image/*" multiple />
      <button type="submit" style="background:#0f172a; color:#fff; font-weight:700; padding:12px; margin-top:14px; border-radius:6px; cursor:pointer;">💾 Save Laptop Changes</button>
    </form>

    <div class="actions">
      <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      alert("Please log in as admin first.");
      window.location.href = "login.html";
    }

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get("id");

    if (!productId) {
      alert("No product ID provided!");
      window.location.href = "upload.html";
    }

    // Load product info
    async function loadProduct() {
      const res = await fetch(`/product/${productId}`);
      if (!res.ok) {
        alert("❌ Failed to load product.");
        return;
      }

      const p = await res.json();
      document.getElementById("name").value = p.name || "";
      document.getElementById("description").value = p.description || "";
      document.getElementById("price").value = p.price || "";
      document.getElementById("quantity").value = p.quantity || "";
      if (p.brand) document.getElementById("brand").value = p.brand;
      if (p.category) document.getElementById("category").value = p.category;
      document.getElementById("processor").value = p.processor || "";
      document.getElementById("ram").value = p.ram || "";
      document.getElementById("storage").value = p.storage || "";
      document.getElementById("gpu").value = p.gpu || "";
      document.getElementById("screen_size").value = p.screen_size || "";

      const previewDiv = document.getElementById("imagePreview");
      previewDiv.innerHTML = "";

      const images = (p.images && p.images.length > 0) ? p.images : (p.image ? [p.image] : []);

      images.forEach(img => {
        const imgEl = document.createElement("img");
        imgEl.src = img;
        imgEl.alt = p.name;
        imgEl.style.width = "80px";
        imgEl.style.height = "80px";
        imgEl.style.objectFit = "cover";
        imgEl.style.borderRadius = "4px";
        previewDiv.appendChild(imgEl);
      });
    }

    // Submit update
    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);

      const res = await fetch(`/update/${productId}`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: formData
      });

      if (res.ok) {
        alert("✅ Laptop updated successfully!");
        window.location.href = "upload.html"; // Return to admin dashboard
      } else {
        alert("❌ Failed to update laptop.");
      }
    });

    function goBack() {
      window.location.href = "upload.html";
    }

    function logout() {
      localStorage.removeItem("token");
      alert("You have been logged out.");
      window.location.href = "login.html";
    }

    loadProduct();
  </script>
</body>

</html>
