<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMMYY’S Inventory Management System for Laptop Store | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #dbe2ef;
      background-image: radial-gradient(circle at center, #edf2fa 0%, #d5dde9 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow: hidden;
    }

    /* Background concentric circular decorative rings & ticks */
    .bg-decor {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1000px;
      height: 1000px;
      pointer-events: none;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
    }

    .c-1 { width: 440px; height: 440px; border: 1.5px solid rgba(175, 170, 225, 0.45); }
    .c-2 { width: 560px; height: 560px; border: 1.5px solid rgba(175, 170, 225, 0.35); }
    .c-3 { width: 680px; height: 680px; border: 1px solid rgba(175, 170, 225, 0.25); }
    .c-4 { width: 800px; height: 800px; border: 1px solid rgba(175, 170, 225, 0.15); }

    .bg-line-h {
      position: absolute;
      width: 760px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(175, 170, 225, 0.5) 15%, transparent 35%, transparent 65%, rgba(175, 170, 225, 0.5) 85%, transparent);
    }
    .bg-line-v {
      position: absolute;
      height: 760px;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(175, 170, 225, 0.5) 15%, transparent 35%, transparent 65%, rgba(175, 170, 225, 0.5) 85%, transparent);
    }

    /* Login Card */
    .login-card {
      position: relative;
      z-index: 2;
      background: #ffffff;
      width: 100%;
      max-width: 410px;
      padding: 40px 36px 36px 36px;
      border-radius: 26px;
      box-shadow: 
        0 4px 6px -1px rgba(0, 0, 0, 0.02),
        0 20px 45px -10px rgba(30, 50, 100, 0.14);
      text-align: center;
    }

    /* Logo Badge */
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-badge {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #eff6ff;
      border: 2px solid #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18), 0 4px 14px rgba(59, 130, 246, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-svg {
      width: 76px;
      height: 76px;
    }

    /* Title & Subtitle */
    .brand-title {
      color: #2563eb;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .brand-subtitle {
      color: #8f9cae;
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: 0.1px;
      margin-bottom: 26px;
    }

    /* Form Fields */
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 7px;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 14px;
      color: #1e293b;
      background: #ffffff;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: #94a3b8;
      font-size: 14px;
    }

    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 48px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.32);
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit:hover {
      background: #1d4ed8;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      background: #93c5fd;
      cursor: not-allowed;
      transform: none;
    }

    /* Bottom Link & Message */
    .register-link {
      font-size: 13.5px;
      color: #64748b;
      text-decoration: none;
      display: inline-block;
      transition: color 0.2s ease;
    }

    .register-link:hover {
      color: #2563eb;
    }

    .toast-msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .toast-msg.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fee2e2;
    }

    .toast-msg.success {
      display: block;
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #dcfce7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 20px 24px 20px;
        border-radius: 20px;
      }

      .brand-title {
        font-size: 22px;
      }

      .brand-subtitle {
        font-size: 13px;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Background Rings & Accents -->
  <div class="bg-decor">
    <div class="bg-line-h"></div>
    <div class="bg-line-v"></div>
    <div class="bg-circle c-1"></div>
    <div class="bg-circle c-2"></div>
    <div class="bg-circle c-3"></div>
    <div class="bg-circle c-4"></div>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <!-- Top Circular Logo -->
    <div class="logo-container">
      <div class="logo-badge">
        <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="47" fill="#eff6ff" />
          
          <!-- Modern Laptop graphic -->
          <!-- Screen Outer Bezel -->
          <rect x="25" y="24" width="50" height="32" rx="3" fill="#0f172a" />
          <!-- Screen Display Glass -->
          <rect x="28" y="27" width="44" height="26" rx="1.5" fill="#1e293b" />
          <rect x="30" y="29" width="40" height="22" rx="1" fill="#2563eb" opacity="0.9" />
          <!-- Screen Code/Store Lines Accent -->
          <line x1="33" y1="34" x2="48" y2="34" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
          <line x1="33" y1="38" x2="42" y2="38" stroke="#93c5fd" stroke-width="1.4" stroke-linecap="round" />
          <circle cx="61" cy="40" r="4.5" fill="#60a5fa" opacity="0.5" />
          
          <!-- Laptop Base / Keyboard deck -->
          <path d="M 18 56 L 82 56 L 86 63 Q 86.5 64 85 64 L 15 64 Q 13.5 64 14 63 Z" fill="#334155" />
          <!-- Trackpad notch -->
          <rect x="42" y="57" width="16" height="2" rx="1" fill="#64748b" />
          <!-- Front lip highlight -->
          <line x1="16" y1="63.5" x2="84" y2="63.5" stroke="#475569" stroke-width="1" />

          <!-- EMMYY'S text in bold blue -->
          <text x="50" y="74" font-size="7.5" font-weight="900" fill="#2563eb" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" letter-spacing="0.5">EMMYY'S</text>
          
          <!-- LAPTOPS text -->
          <text x="50" y="81" font-size="5" font-weight="700" fill="#64748b" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" letter-spacing="0.5">LAPTOP STORE</text>
        </svg>
      </div>
    </div>

    <!-- Title & Subtitle -->
    <h1 class="brand-title">EMMYY’S LAPTOP STORE</h1>
    <p class="brand-subtitle">Inventory Management System for Laptop Store</p>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Username or Email</label>
        <input 
          type="text" 
          id="username" 
          class="form-input" 
          placeholder="Enter username or email" 
          required 
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        Sign In
      </button>
    </form>

    <a href="register.html" class="register-link">Don't have an account? Register</a>
    <div id="toast" class="toast-msg"></div>
  </div>

  <script>
    function showToast(message, type) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = `toast-msg ${type}`;
      toast.style.display = "block";
    }

    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        showToast("Please enter both username/email and password.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email: username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(data.error || "Login failed. Please check your credentials.", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign In";
          return;
        }

        // Save token, username, role, and phone
        localStorage.setItem("token", data.token);
        localStorage.setItem("username", data.username);
        localStorage.setItem("role", data.role);
        if (data.phone || (data.user && data.user.phone)) {
          localStorage.setItem("phone", data.phone || data.user.phone);
        }

        showToast(`Welcome back, ${data.username}! Redirecting...`, "success");

        setTimeout(() => {
          if (data.role === "admin") {
            window.location.href = "admin-dashboard.html";
          } else {
            window.location.href = "user-dashboard.html";
          }
        }, 800);

      } catch (err) {
        console.error("Login error:", err);
        showToast("Server error. Please try again later.", "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
